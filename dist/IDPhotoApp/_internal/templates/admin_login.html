<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login – {{ cfg.app.title }}</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: #0e0e14;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.login-card {
  background: #fff;
  border-radius: 16px;
  padding: 2.5rem;
  width: 360px;
  box-shadow: 0 20px 60px rgba(0,0,0,.4);
}
.login-card h2 {
  font-size: 1.4rem;
  font-weight: 700;
  margin-bottom: .3rem;
}
.login-card p { font-size: .85rem; color: #666; margin-bottom: 2rem; }
.field { margin-bottom: 1rem; }
.field label { display: block; font-size: .8rem; font-weight: 600; color: #555; margin-bottom: .3rem; }
.field input {
  width: 100%; padding: .65rem .9rem;
  border: 1.5px solid #e2e0db;
  border-radius: 8px;
  font-size: .92rem;
  font-family: inherit;
  transition: border-color .2s;
}
.field input:focus { outline: none; border-color: #2563eb; }
.err { color: #dc2626; font-size: .8rem; margin-bottom: .8rem; display: none; }
.btn {
  width: 100%; padding: .75rem;
  background: #2563eb; color: #fff;
  border: none; border-radius: 8px;
  font-size: .95rem; font-weight: 600;
  cursor: pointer; font-family: inherit;
  transition: background .2s;
}
.btn:hover { background: #1d4ed8; }
.back { text-align: center; margin-top: 1rem; font-size: .82rem; }
.back a { color: #2563eb; text-decoration: none; }
</style>
</head>
<body>
<div class="login-card">
  <h2>{{ cfg.app.logo }} Admin Login</h2>
  <p>Sign in to manage packages and settings</p>
  <div class="err" id="err">Invalid username or password.</div>
  <div class="field">
    <label>Username</label>
    <input type="text" id="uname" placeholder="admin" onkeydown="if(event.key==='Enter')login()">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="pw" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
  </div>
  <button class="btn" onclick="login()">Sign In</button>
  <div class="back"><a href="/">← Back to app</a></div>
</div>
<script>
async function login() {
  const u = document.getElementById('uname').value;
  const p = document.getElementById('pw').value;
  const res = await fetch('/admin/login', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ username: u, password: p })
  });
  const data = await res.json();
  if (data.success) window.location = '/admin';
  else document.getElementById('err').style.display = 'block';
}
</script>
</body>
</html>
